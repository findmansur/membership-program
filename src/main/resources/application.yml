server:
  port: 8080

spring:
  application:
    name: firstclub-membership
  datasource:
    url: jdbc:h2:mem:membership;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console

membership:
  scheduler:
    expiry-check-cron: "0 */5 * * * *"        # every 5 minutes
    tier-reevaluation-cron: "0 0 * * * *"     # hourly
  tier:
    auto-upgrade-enabled: true

logging:
  level:
    root: INFO
    com.firstclub.membership: INFO
